appId: ${APP_ID}
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      text: ".*New Container.*"
    timeout: 10000
- tapOn:
    text: ".*New Container.*"
    retryTapIfNoChange: true
- tapOn:
    id: "container_name_input"
- inputText: "Spare Electronics"
- tapOn:
    id: "container_description_input"
- inputText: "electronics, cables, microcontrollers"
- scroll
- tapOn:
    id: "save_container_button"
- extendedWaitUntil:
    visible:
      id: "home_container_tile_0"
    timeout: 5000
- tapOn:
    id: "home_container_tile_0"
- extendedWaitUntil:
    visible:
      id: "container_detail_title"
    timeout: 5000
- assertVisible:
    text: "Spare Electronics"
- assertVisible:
    id: "container_detail_add_items_fab"
- tapOn:
    id: "container_detail_add_items_fab"
- extendedWaitUntil:
    visible:
      id: "mock_capture_button"
    timeout: 5000
- tapOn:
    id: "mock_capture_button"
- extendedWaitUntil:
    visible:
      id: "save_all_button"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "Microcontroller"
    timeout: 10000
- tapOn:
    id: "save_all_button"
- extendedWaitUntil:
    visible:
      id: "loop_done_button"
    timeout: 10000
- tapOn:
    id: "loop_done_button"
- extendedWaitUntil:
    visible:
      id: "home_search_button"
    timeout: 5000
- tapOn:
    id: "home_search_button"
- extendedWaitUntil:
    visible:
      id: "search_input"
    timeout: 5000
- tapOn:
    id: "search_input"
- inputText: "microcontroller"
- tapOn:
    id: "search_submit_button"
- extendedWaitUntil:
    visible:
      id: "search_result_item_0"
    timeout: 5000
- assertVisible:
    text: ".*Microcontroller.*"
- tapOn:
    id: "search_result_item_0"
- extendedWaitUntil:
    visible:
      id: "item_detail_title"
    timeout: 5000
- assertVisible:
    text: "Microcontroller"
- assertVisible:
    id: "item_detail_container_card"
- assertVisible:
    text: ".*Spare Electronics.*"
